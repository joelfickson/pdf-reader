[package]
name = "pdf-reader"
version = "0.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/joelfickson/pdf-reader"
description = "A lightweight desktop PDF reader for macOS and Windows"
default-run = "pdf-reader"

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
image = { version = "0.25", default-features = false }
parking_lot = "0.13"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_7881", "thread_safe"] }
agent-client-protocol = { version = "5", features = ["process"] }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
smallvec = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[features]
live-agent = []

[build-dependencies]
winresource = "=0.1.34"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
