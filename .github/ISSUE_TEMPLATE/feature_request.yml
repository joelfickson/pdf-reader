name: Feature request
description: Suggest an improvement to the reader or the website.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Include sketches or a link to a mock if it changes the interface.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know it works, for example the tests or measurements that should pass.
