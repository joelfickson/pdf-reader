name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
      channel:
        description: Release channel
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
          - rc
      tag:
        description: Existing tag to package and release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Generate release tag and targets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      platform: ${{ steps.release.outputs.platform }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - name: Create or select release tag
        id: release
        env:
          RELEASE_PLATFORM: ${{ inputs.platform }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Start releases from the main branch"
              exit 1
            fi
            if [ -n "$RELEASE_TAG_INPUT" ]; then
              release_tag="$RELEASE_TAG_INPUT"
              if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
                echo "::error::Release tag $release_tag does not exist"
                exit 1
              fi
            else
              release_tag="$(uv run --no-project python scripts/next_release_tag.py "$RELEASE_CHANNEL")"
              git tag "$release_tag" "$GITHUB_SHA"
              git push origin "$release_tag"
            fi
            release_platform="$RELEASE_PLATFORM"
          else
            release_tag="$GITHUB_REF_NAME"
            release_platform=all
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Release tag $release_tag is not a supported semantic version tag"
            exit 1
          fi
          package_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.loads(open("Cargo.toml", "rb").read().decode())["package"]["version"])')"
          if [[ "$release_tag" != "v$package_version" && "$release_tag" != "v$package_version-beta."* && "$release_tag" != "v$package_version-rc."* ]]; then
            echo "::error::Release tag $release_tag does not match Cargo.toml version $package_version"
            exit 1
          fi
          case "$release_tag" in
            *-beta.*) release_channel=beta ;;
            *-rc.*) release_channel=rc ;;
            *) release_channel=stable ;;
          esac
          if [ "$release_channel" = "stable" ] && [ "$release_platform" != "all" ]; then
            echo "::error::Stable releases must include every platform so the download links always resolve"
            exit 1
          fi
          case "$release_platform" in
            macos)
              matrix='{"include":[{"os":"macos-15","platform":"macos-arm64"},{"os":"macos-15-intel","platform":"macos-x64"}]}'
              ;;
            windows)
              matrix='{"include":[{"os":"windows-2022","platform":"windows-x64"}]}'
              ;;
            all)
              matrix='{"include":[{"os":"macos-15","platform":"macos-arm64"},{"os":"macos-15-intel","platform":"macos-x64"},{"os":"windows-2022","platform":"windows-x64"}]}'
              ;;
            *)
              echo "::error::Unsupported release platform $release_platform"
              exit 1
              ;;
          esac
          {
            echo "tag=$release_tag"
            echo "channel=$release_channel"
            echo "platform=$release_platform"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Preparing $release_channel release $release_tag for $release_platform"

  check:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      platform: ${{ needs.prepare.outputs.platform }}

  package:
    name: Package ${{ matrix.platform }}
    needs: [prepare, check]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: Swatinem/rust-cache@v2
      - run: uv run scripts/setup_pdfium.py
      - if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12 != ''
        name: Import Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user | tr -d '"' | xargs security list-keychains -d user -s "$keychain"
          rm "$certificate"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          echo "::add-mask::$identity"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS'
        run: uv run scripts/package_macos.py
      - if: runner.os == 'macOS' && env.MACOS_SIGNING_IDENTITY != ''
        name: Notarize and staple
        run: |
          ditto -c -k --keepParent "target/release/PDF Reader.app" "$RUNNER_TEMP/notarize.zip"
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          rm "$key"
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "target/release/PDF Reader.app"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Stapling failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          xcrun stapler validate "target/release/PDF Reader.app"
          spctl --assess --type execute --verbose=2 "target/release/PDF Reader.app"
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "target/release/PDF Reader.app" "pdf-reader-${{ matrix.platform }}.zip"
      - if: runner.os == 'macOS'
        name: Verify packaged bundle
        run: |
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "pdf-reader-${{ matrix.platform }}.zip" "$RUNNER_TEMP/verify"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/verify/PDF Reader.app"
          "$RUNNER_TEMP/verify/PDF Reader.app/Contents/MacOS/pdf-reader" --check tests/fixtures/reading.pdf
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\licenses\pdfium" | Out-Null
          Copy-Item "target\release\pdf-reader.exe" "$stage\pdf-reader.exe"
          Copy-Item "vendor\pdfium\bin\pdfium.dll" "$stage\pdfium.dll"
          Copy-Item "LICENSE" "$stage\licenses\Application-LICENSE"
          Copy-Item "vendor\pdfium\LICENSE" "$stage\licenses\PDFium-LICENSE"
          Copy-Item "vendor\pdfium\licenses\*" "$stage\licenses\pdfium" -Recurse
          $check = Start-Process -FilePath "$stage\pdf-reader.exe" -ArgumentList "--check", "tests\fixtures\reading.pdf" -Wait -PassThru -NoNewWindow
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
          Compress-Archive -Path "$stage\*" -DestinationPath "pdf-reader-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-reader-${{ matrix.platform }}
          path: pdf-reader-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    env:
      WEBSITE_REVALIDATE_SECRET: ${{ secrets.WEBSITE_REVALIDATE_SECRET }}
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pdf-reader-*
          path: release-assets
          merge-multiple: true
      - run: cd release-assets && sha256sum -- *.zip > SHA256SUMS.txt
      - env:
          MACOS_NOTARIZED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          RELEASE_PLATFORM: ${{ needs.prepare.outputs.platform }}
        run: |
          {
            echo "## Install"
            echo
            if [ "$RELEASE_PLATFORM" != "windows" ]; then
              echo "macOS: download the zip for your Mac (arm64 for Apple silicon, x64 for Intel), unzip it, and move PDF Reader to Applications."
              if [ "$MACOS_NOTARIZED" != "true" ]; then
                echo "This build is not notarized. The first time you open it, macOS blocks it. Open System Settings, go to Privacy & Security, and click Open Anyway next to the PDF Reader message."
              fi
            fi
            if [ "$RELEASE_PLATFORM" != "macos" ]; then
              echo "Windows: unzip the archive and run pdf-reader.exe. Keep pdfium.dll in the same folder. This build is not code signed, so Windows SmartScreen may warn on first launch. Click More info, then Run anyway."
            fi
            echo
            echo "Verify downloads against SHA256SUMS.txt."
          } > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          args=(release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md --generate-notes --title "$RELEASE_TAG")
          if [ "$RELEASE_CHANNEL" != "stable" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
      - if: env.WEBSITE_REVALIDATE_SECRET != '' && env.WEBSITE_URL != ''
        name: Refresh the website download page
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 -X POST -H "Authorization: Bearer $WEBSITE_REVALIDATE_SECRET" "$WEBSITE_URL/api/revalidate"
