name: Check
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      platform:
        type: string
        required: false
        default: all

jobs:
  check:
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain
      - run: uv run scripts/setup_pdfium.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -- --ignored
      - if: runner.os == 'macOS'
        name: Package and validate macOS application bundles
        run: |
          uv run scripts/package_macos.py
          uv run scripts/package_macos.py --debug
          for bundle in "target/release/PDF Reader.app" "target/debug/PDF Reader Debug.app"; do
            plutil -lint "$bundle/Contents/Info.plist"
            test "$(plutil -extract CFBundleIconFile raw -o - "$bundle/Contents/Info.plist")" = "pdf-reader.icns"
            test -f "$bundle/Contents/Resources/pdf-reader.icns"
            iconutil -c iconset "$bundle/Contents/Resources/pdf-reader.icns" -o "$RUNNER_TEMP/$(basename "$bundle" .app).iconset"
          done
      - if: runner.os == 'Windows'
        name: Build release executable with embedded icon
        run: cargo build --locked --release
